# Firebase App Hosting configuration for Coffez.ch
# Docs:
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 10
  minInstances: 0
  concurrency: 80

env:
  - variable: ENV
    value: production

  - variable: GITHUB_BRANCH
    value: main

  - variable: GOOGLE_MAPS_EMBED_API_KEY
    secret: GOOGLE_MAPS_EMBED_API_KEY

  # ⏸ DÉSACTIVÉ — l'autorisation d'accès au secret ne fonctionne toujours pas.
  #    Tant que cette ligne est active, TOUS les déploiements échouent et
  #    plus aucune modification du site ne peut être mise en ligne.
  #    À réactiver seulement une fois l'accès réellement vérifié.
  # - variable: STRIPE_SECRET_KEY
  #   secret: STRIPE_SECRET_KEY
